# The checks of common: the format, the lint, the build and the tests.
#
# The checkout keeps the layout of the workspace that the presets expect: the project in "projects/common", and vcpkg
# and "cache" next to "projects". Thus CI uses the same presets and tools/preset.bat as a developer.
#
# The tests of Python.h need Python 3.7, the version of the game. The job installs it and gives its folder in
# TS4_PYTHON37. A step stops the job if a test was skipped, so CI never passes without these tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # The last release of Python 3.7 that has a Windows installer.
  PYTHON37_VERSION: "3.7.9"

jobs:
  format:
    name: Format (clang-format, ruff)
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: projects/common
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements-check.txt

      - name: Check the format
        run: python tools/check.py format

  lint:
    name: Lint (clang-tidy)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: projects/common
          persist-credentials: false

      - uses: ./projects/common/.github/actions/prepare

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements-check.txt

      # The configure step installs the vcpkg packages and gets MinHook, and writes compile_commands.json.
      - name: Configure
        run: tools\preset.bat x64-release configure

      - name: Check with clang-tidy
        run: python tools/check.py tidy

  build-test:
    name: Build and test
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: projects/common
          persist-credentials: false

      - uses: ./projects/common/.github/actions/prepare
        with:
          save-cache: "true"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python37
        with:
          python-version: ${{ env.PYTHON37_VERSION }}
          architecture: x64
          update-environment: false

      - name: Give the folder of Python 3.7 to the tests
        env:
          PYTHON37_PATH: ${{ steps.python37.outputs.python-path }}
        run: |
          "TS4_PYTHON37=$(Split-Path -Parent $env:PYTHON37_PATH)" >> $env:GITHUB_ENV

      # The preset compiles with /W4 /WX, so a warning stops the build. ctest shows the output of a test that fails.
      - name: Configure, build and test
        run: tools\preset.bat x64-release

      - name: Check that no test was skipped
        run: |
          $log = 'build/x64-release/Testing/Temporary/LastTest.log'
          $skipped = Select-String -Path $log -Pattern '[  SKIPPED ]' -SimpleMatch
          if ($skipped) {
            $skipped | ForEach-Object { $_.Line }
            "::error::Some tests were skipped. The tests of Python.h need the folder of Python 3.7 in TS4_PYTHON37."
            exit 1
          }

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log
          path: projects/common/build/x64-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
